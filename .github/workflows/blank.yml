name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Projeyi çıkart
        run: |
          unzip AracTakip_v1_APK_Hazir.zip
          cd AracTakip_v1
          gradle :app:assembleDebug

      - name: APK dosyasını hazırla
        uses: actions/upload-artifact@v4
        with:
          name: AracTakip-APK
          path: AracTakip_v1/app/build/outputs/apk/debug/app-debug.apk
